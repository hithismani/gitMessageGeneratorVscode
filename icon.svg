<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Sleek, dark macOS/VS Code terminal background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- AI Magic Gradient -->
    <linearGradient id="magic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Drop Shadow for the magic sparkle -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Terminal Window Base -->
  <rect width="256" height="256" rx="52" fill="url(#bg)" />
  <!-- Glassy Inner Border -->
  <rect width="252" height="252" x="2" y="2" rx="50" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- macOS Window Controls -->
  <g transform="translate(36, 42)">
    <circle cx="0" cy="0" r="8" fill="#ef4444" />
    <circle cx="26" cy="0" r="8" fill="#f59e0b" />
    <circle cx="52" cy="0" r="8" fill="#22c55e" />
  </g>

  <!-- Line 1: '> git commit' -->
  <g transform="translate(28, 92)">
    <path d="M 0 0 L 12 12 L 0 24" stroke="#c084fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="28" y="20" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="bold" fill="#f8fafc">git commit</text>
  </g>

  <!-- Line 2: '> -m "✨███"' -->
  <g transform="translate(28, 142)">
    <path d="M 0 0 L 12 12 L 0 24" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="28" y="20" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="bold" fill="#94a3b8">-m</text>

    <!-- The Magic Generated Message -->
    <g transform="translate(76, 20)">
      <text x="0" y="0" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="bold" fill="url(#magic)">"</text>

      <!-- Magic Sparkle -->
      <g transform="translate(28, -8)" fill="url(#magic)" filter="url(#glow)">
        <path d="M 0 -13 C 2 -4, 4 -2, 13 0 C 4 2, 2 4, 0 13 C -2 4, -4 2, -13 0 C -4 -2, -2 -4, 0 -13 Z" />
      </g>

      <!-- "Generated" Text Blocks -->
      <rect x="46" y="-22" width="32" height="18" rx="4" fill="url(#magic)" />
      <rect x="84" y="-22" width="14" height="18" rx="4" fill="url(#magic)" opacity="0.6" />

      <text x="104" y="0" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="bold" fill="url(#magic)">"</text>
    </g>
  </g>

  <!-- Line 3: '> [cursor]' -->
  <g transform="translate(28, 192)">
    <path d="M 0 0 L 12 12 L 0 24" stroke="#e879f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="28" y="1" width="16" height="24" rx="4" fill="#a855f7" />
  </g>

</svg>
