<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bg)" />

  <!-- Git branch line (subtle, behind everything) -->
  <path d="M44 95 L44 72 Q44 62 54 58 L74 50 Q84 46 84 36 L84 33"
        stroke="rgba(255,255,255,0.25)" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Git commit dots on the branch -->
  <circle cx="44" cy="95" r="5" fill="rgba(255,255,255,0.5)" />
  <circle cx="64" cy="54" r="5" fill="rgba(255,255,255,0.5)" />
  <circle cx="84" cy="33" r="5" fill="rgba(255,255,255,0.5)" />

  <!-- Sparkle / star (main icon element) -->
  <!-- 4-point star centered at 64,64 -->
  <path d="M64 28 L68 56 L96 60 L68 64 L64 92 L60 64 L32 60 L60 56 Z"
        fill="url(#spark)" opacity="0.95" />

  <!-- Small accent sparkles -->
  <path d="M90 78 L92 84 L98 86 L92 88 L90 94 L88 88 L82 86 L88 84 Z"
        fill="white" opacity="0.7" />
  <path d="M30 36 L31.5 40 L35.5 41.5 L31.5 43 L30 47 L28.5 43 L24.5 41.5 L28.5 40 Z"
        fill="white" opacity="0.5" />
</svg>
